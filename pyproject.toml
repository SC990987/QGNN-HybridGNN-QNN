[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qgnn-hybrid"
version = "0.1.0"
description = "Hybrid Graph Neural Network–Quantum Neural Network for quark/gluon jet classification"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]